[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sealdice-sentinel"
version = "0.1.0"
description = "Independent monitoring service for SealDice and Yogurt/Milky"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "packaging>=24,<26",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff==0.16.8",
]

[project.scripts]
sealdice-sentinel = "sealdice_sentinel.app:main"
sealdice-sentinel-updater = "sealdice_sentinel.updater:main"

[project.urls]
Homepage = "https://github.com/tcplsa/sealdice-sentinel"
Repository = "https://github.com/tcplsa/sealdice-sentinel"
Issues = "https://github.com/tcplsa/sealdice-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

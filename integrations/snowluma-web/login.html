<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ 扫码登录</title>
<style>
body{margin:0;padding:16px;font:14px system-ui;color:#303133;background:#fff}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}input{box-sizing:border-box;flex:1;min-width:140px;padding:10px;border:1px solid #dcdfe6;border-radius:4px;font:inherit}button{border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266;padding:10px 18px;cursor:pointer;font:inherit}.primary{background:#409eff;border-color:#409eff;color:#fff}button:disabled{opacity:.55;cursor:default}.muted{color:#909399;font-size:13px}.error{color:#f56c6c}.qr{display:block;width:230px;height:230px;object-fit:contain;background:#fff;margin:14px auto}.login{text-align:center;margin-top:16px}#state{color:#606266;margin:16px 0 4px}
</style>
<div class="row"><label for="account">QQ 号</label><input id="account" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="请输入 QQ 号"><button id="connect" class="primary" disabled>连接</button></div>
<p class="muted">本次使用一个 SL 客户端；切换 QQ 号前请先停用当前 SL 连接。</p>
<p id="state">填写 QQ 号后点击连接</p>
<div id="login" class="login" hidden><img id="qr" class="qr" alt="QQ 登录二维码" hidden><p id="hint">正在准备二维码…</p><button id="refresh" disabled>刷新二维码</button></div>
<p id="error" class="error"></p><p id="auth-warning" class="error" hidden>请先登录海豹 WebUI，再打开此登录窗口。</p>
<script type="module">
const $=id=>document.getElementById(id);
let started=false,busy=false,connecting=false,connectFailed=false,refreshing=false,timer,qrUrl,lastQr=0;
const query=new URLSearchParams(location.search).get('account');
$('account').value=/^[1-9][0-9]{4,19}$/.test(query||'')?query:'2325552935';
async function api(path,body){const response=await fetch('/qq-login/'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),credentials:'same-origin',cache:'no-store'});if(!response.ok){if(response.status===401){$('auth-warning').hidden=false;$('connect').disabled=true;clearInterval(timer)}throw new Error(await response.text())}return response.json()}
async function image(refresh=false){if(!started)return;const response=await fetch('/qq-login/qr'+(refresh?'?refresh=1':''),{credentials:'same-origin',cache:'no-store'});if(!response.ok){$('qr').hidden=true;throw new Error('二维码暂未就绪，请稍后刷新')}const next=URL.createObjectURL(await response.blob());if(qrUrl)URL.revokeObjectURL(qrUrl);qrUrl=next;$('qr').src=next;$('qr').hidden=false;lastQr=Date.now()}
async function state(){if(refreshing||busy||!started)return;refreshing=true;try{const value=await api('status');if(value.state==='paused'){$('state').textContent=value.message;$('qr').hidden=true;$('refresh').disabled=true;$('connect').disabled=true;clearInterval(timer);return}if(value.state==='connected'){$('state').textContent='已连接';$('hint').textContent='QQ 已登录并接入海豹。';$('qr').hidden=true;$('refresh').disabled=true;clearInterval(timer);window.parent.postMessage({type:'snowluma-connected'},location.origin);return}if(value.action?.state==='failed'&&connecting){connecting=false;connectFailed=true;throw new Error('接入未完成，请点击连接重试；已登录 QQ 不会重置')}if(value.state==='ready'){if(connectFailed)return;if(!connecting){connecting=true;$('state').textContent='登录已确认，正在连接…';try{await api('action/connect',{})}catch(error){connecting=false;connectFailed=true;throw error}}return}if(value.state==='wrong_account'){$('state').textContent='登录账号与填写的 QQ 号不匹配';return}$('state').textContent='等待扫码确认';$('hint').textContent='用填写的 QQ 号扫码，并在手机上确认。';if(Date.now()-lastQr>10000){try{await image()}catch(error){$('hint').textContent=error.message}}}catch(error){$('error').textContent=error.message}finally{refreshing=false}}
async function start(){if(busy)return;const account=$('account').value.trim();if(!/^[1-9][0-9]{4,19}$/.test(account)){$('error').textContent='请输入正确的 QQ 号';return}busy=true;connecting=false;connectFailed=false;$('connect').disabled=true;$('error').textContent='';$('state').textContent='正在准备登录…';$('login').hidden=false;$('qr').hidden=true;$('hint').textContent='正在生成二维码，请稍候…';try{await api('start',{account});started=true;lastQr=0;$('refresh').disabled=false;clearInterval(timer);timer=setInterval(state,3000);await image(true).catch(()=>{})}catch(error){$('error').textContent=error.message}finally{busy=false;$('connect').disabled=false;await state()}}
$('connect').onclick=start;$('account').onkeydown=event=>{if(event.key==='Enter')start()};
$('refresh').onclick=async()=>{if(busy||refreshing)return;refreshing=true;try{$('refresh').disabled=true;await image(true);$('error').textContent=''}catch(error){$('error').textContent=error.message}finally{$('refresh').disabled=false;refreshing=false}};
if(window.parent===window){location.replace('/#/connect')}else{try{const token=localStorage.getItem('t');if(!token)throw new Error('请先登录海豹 WebUI。');await api('session',{token});const current=await api('status');if(current.state==='paused'){$('state').textContent=current.message}else{$('connect').disabled=false}}catch(error){$('auth-warning').hidden=false;$('error').textContent=error.message}}
window.addEventListener('pagehide',()=>{clearInterval(timer);if(qrUrl)URL.revokeObjectURL(qrUrl)});
</script></html>

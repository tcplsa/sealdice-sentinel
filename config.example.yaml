app:
  timezone: Asia/Shanghai
  database_path: /var/lib/sealdice-sentinel/sentinel.db
  log_level: INFO

milky:
  base_url: http://127.0.0.1:3000
  access_token: change-me
  webhook_host: 127.0.0.1
  webhook_port: 18100
  webhook_path: /webhooks/milky
  webhook_token: change-me-too
  health_interval_seconds: 30
  failure_threshold: 3
  reconciliation_interval_seconds: 300

sealdice:
  health_url: http://127.0.0.1:3211
  systemd_unit: sealdice.service
  health_interval_seconds: 30
  failure_threshold: 3
  journal_monitor_enabled: true
  log_failure_threshold: 3
  log_failure_window_seconds: 120

